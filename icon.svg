<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Fundo Arredondado Escuro -->
  <rect width="512" height="512" rx="128" fill="#0f172a" />
  
  <!-- Borda Sutil -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#334155" stroke-width="8" opacity="0.6"/>
  
  <!-- Carteira / Símbolo Financeiro com Gradiente Indigo para Esmeralda -->
  <g transform="translate(96, 96)" filter="url(#shadow)">
    <!-- Corpo da Carteira -->
    <rect x="16" y="48" width="288" height="224" rx="36" fill="url(#grad)" />
    
    <!-- Aba Superior / Divisória -->
    <path d="M16 96 C16 68, 40 48, 68 48 L252 48 C280 48, 304 68, 304 96 L304 104 L16 104 Z" fill="#4f46e5" opacity="0.4"/>
    
    <!-- Fecho da Carteira -->
    <path d="M208 128 L304 128 C312 128, 320 136, 320 144 L320 176 C320 184, 312 192, 304 192 L208 192 C196 192, 184 180, 184 160 C184 140, 196 128, 208 128 Z" fill="#0f172a"/>
    <circle cx="216" cy="160" r="10" fill="#34d399" />
    
    <!-- Linha de Fluxo / Gráfico Sutil -->
    <path d="M48 200 L96 160 L144 180 L200 130" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>
</svg>

